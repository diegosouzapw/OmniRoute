      summary: Toggle Dario auto-restart-when-adopted
      description: >-
        When enabled, an externally-adopted (not OmniRoute-spawned) Dario process
        is restarted under OmniRoute's own supervisor on the next health-check
        cycle instead of being left as adopted-only.
        **LOCAL_ONLY** — loopback only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        "204":
          description: Flag updated
        "400":
          description: Invalid request body
        "500":
          description: Update failed

  /api/services/dario/admin/login-start:
    post:
      tags: [Embedded Services]
      summary: Start a Dario account-pool login (device-code style)
      description: >-
        Forwards to the running Dario instance's `POST /admin/login/start` using
        the stored admin token. The operator opens the returned `authorize_url`,
        approves in their own Claude account, then posts the displayed code to
        `/admin/login-complete`. **LOCAL_ONLY** — loopback only.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                alias:
                  type: string
                  description: Optional account alias; Dario assigns one if omitted.
      responses:
        "200":
          description: Login challenge created
          content:
            application/json:
              schema:
                type: object
                properties:
                  alias:
                    type: string
                  authorize_url:
                    type: string
                  expires_at:
                    type: string
                  instructions:
                    type: string
        "400":
          description: Invalid request body
        "401":
          description: Missing or invalid admin auth
        "502":
          description: Dario did not respond or Dario is not running

  /api/services/dario/admin/login-complete:
    post:
      tags: [Embedded Services]
      summary: Complete a Dario account-pool login
      description: >-
        Forwards to the running Dario instance's `POST /admin/login/complete`.
        On success the account becomes routable immediately (Dario hot-reloads
        its pool). **LOCAL_ONLY** — loopback only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alias, code]
              properties:
                alias:
                  type: string
                code:
                  type: string
      responses:
        "200":
          description: Account added
          content:
            application/json:
              schema:
                type: object
                properties:
                  alias:
                    type: string
                  status:
                    type: string
                  expires_at:
                    type: string
        "400":
          description: Invalid request body
        "401":
          description: Missing or invalid admin auth
        "502":
          description: Dario did not respond or Dario is not running

  /api/services/dario/admin/accounts:
    get:
      tags: [Embedded Services]
      summary: List Dario account-pool accounts
      description: >-
        Forwards to the running Dario instance's `GET /admin/accounts`.
        **LOCAL_ONLY** — loopback only.
      responses:
        "200":
          description: Account list
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items:
                      type: object
                  count:
                    type: integer
        "401":
          description: Missing or invalid admin auth
        "502":
          description: Dario did not respond or Dario is not running
    delete:
      tags: [Embedded Services]
      summary: Remove a Dario account-pool account
      description: >-
        Forwards to the running Dario instance's `DELETE /admin/accounts/<alias>`.
        The alias is taken from a `?alias=` query param or a `{ alias }` JSON body.
        **LOCAL_ONLY** — loopback only.
      parameters:
        - name: alias
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                alias:
                  type: string
      responses:
        "200":
          description: Account removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  alias:
                    type: string
                  removed:
                    type: boolean
        "400":
          description: Missing alias
        "401":
          description: Missing or invalid admin auth
        "502":
          description: Dario did not respond or Dario is not running

  /api/services/dario/admin/import-from-omniroute:
    get:
      tags: [Embedded Services]
      summary: List OmniRoute claude connections eligible for Dario import
      description: >-
        Returns eligible OmniRoute `claude` OAuth provider connections (metadata
        only — id/name/email/org tier, never tokens) so the UI can offer a picker
        when more than one exists. **LOCAL_ONLY** — loopback only.
      responses:
        "200":
          description: Eligible connections
          content:
            application/json:
              schema:
                type: object
                properties:
                  connections:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        email:
                          type: string
                          nullable: true
                        organizationType:
                          type: string
                          nullable: true
                        organizationRateLimitTier:
                          type: string
                          nullable: true
        "401":
          description: Missing or invalid admin auth
    post:
      tags: [Embedded Services]
      summary: Import an OmniRoute claude connection's OAuth tokens into Dario
      description: >-
        Writes the source connection's access/refresh token pair directly into
        Dario's own account-file store (`~/.dario/accounts/<alias>.json`), reusing
        the shared Claude Code OAuth client_id, then restarts the Dario supervisor
        so it picks up the new account. **LOCAL_ONLY** — loopback only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connectionId]
              properties:
                connectionId:
                  type: string
                alias:
                  type: string
                  description: Optional custom alias; derived from the source email if omitted.
      responses:
        "200":
          description: Account imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  alias:
                    type: string
                  imported:
                    type: boolean
                  sourceConnectionId:
                    type: string
                  sourceEmail:
                    type: string
                    nullable: true
        "400":
          description: Invalid request body, unsupported connection, or missing tokens
        "401":
          description: Missing or invalid admin auth
        "404":
          description: Connection not found
        "500":
          description: Import failed

  /api/services/{name}/logs:
    get:
      tags: [Embedded Services]
      summary: Stream service logs via SSE
      description: >-
        Returns a Server-Sent Events stream from the service's in-memory ring buffer
        (5 MB, circular). Sends a `snapshot` event with historical lines first, then
        live `log` events, plus a `heartbeat` every 15 s.
        **LOCAL_ONLY** — loopback only.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            enum: [9router, cliproxy]
        - name: tail
          in: query
          schema:
            type: integer
            default: 200
            maximum: 1000
          description: Number of historical lines to include in the initial snapshot
        - name: filter
          in: query
          schema:
            type: string
            maxLength: 200
          description: >-
            Case-insensitive substring filter applied to log lines.
            No regex — ReDoS-safe by design.
      responses:
        "200":
          description: SSE log stream
          content:
            text/event-stream:
              schema:
                type: string
                description: >-
                  Events: `snapshot` (LogLine[]), `log` (LogLine), `heartbeat` ({})
        "400":
          description: filter parameter exceeds maximum length
        "404":
          description: Service not found


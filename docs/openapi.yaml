  /api/modality-bridge/video/runtime:
    get:
      x-loopback-only: true
      tags: [System]
      summary: Get Video Bridge runtime status
      description: Requires trusted loopback locality before authentication or probing, then management authentication. Returns sanitized FFmpeg and ffprobe availability and versions. The response never contains commands, paths, or stderr.
      security:
        - ManagementSessionAuth: []
      responses:
        "200":
          description: Video Bridge runtime availability
        "401":
          description: Unauthorized
        "403":
          description: Localhost access required

  /api/modality-bridge/video/extract:
    post:
      x-loopback-only: true
      tags: [System]
      summary: Extract bounded Video Bridge frames through the internal broker
      description: Internal per-process-authenticated trusted-loopback broker. Accepts at most 50 MiB of video bytes; URLs, paths, executable names, and command arguments are not part of the contract. The body pipeline and streamed handler reader both enforce the input cap. The broker applies fixed FFmpeg/ffprobe confinement, a single extraction slot with four pending jobs/100 MiB queued input, a 4 MiB per-frame cap, and a 32 MiB total response cap. Optional focus bounds and scene-aware sampling are deterministic and bounded. Transcript provenance is a metadata contract on the parent video part, not an instruction to run speech-to-text. This is not a public upload API.
      security: []
      parameters:
        - in: query
          name: frames
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 16
        - in: query
          name: samplingPolicy
          required: false
          description: Optional deterministic sampling policy. Scene-aware detection falls back to uniform sampling on detector failure.
          schema:
            type: string
            enum: [uniform, scene_aware, segment_aware]
            default: uniform
        - in: query
          name: start
          required: false
          description: Optional focus-window start in seconds. The broker clamps it to the media duration.
          schema:
            type: number
            minimum: 0
        - in: query
          name: end
          required: false
          description: Optional focus-window end in seconds. It must be greater than the normalized start.
          schema:
            type: number
            minimum: 0
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              maxLength: 52428800
      responses:
        "200":
          description: Sanitized duration and bounded JPEG data-URI frames
        "400":
          description: Invalid fixed broker contract
        "403":
          description: Authenticated trusted-loopback broker identity required
        "413":
          description: Input exceeds the 50 MiB byte limit
        "422":
          description: Media rejected or extraction failed
        "499":
          description: Client request aborted
        "503":
          description: Queue capacity is exhausted, or FFmpeg/ffprobe is unavailable on PATH
          headers:
            Retry-After:
              description: Present with value 1 when queue capacity is exhausted
              schema:
                type: integer
                minimum: 1
        "504":
          description: Fixed 120-second broker extraction deadline exceeded

  /api/modality-bridge/video/drilldown:
    get:
      x-loopback-only: true
      tags: [System]
      summary: Read a bounded Video Bridge drill-down slice
      description: Internal loopback/token-authenticated lookup into a short-lived cache isolated by an opaque principal, session, and media reference. It never downloads media or starts a subprocess; start/end and frame count only select already materialized, canonicalized JPEG frames whose dimensions were derived from their bytes. This cache substrate is not yet wired to the transparent Video Bridge request path and does not yet expose multi-resolution selection.
      security: []
      parameters:
        - in: header
          name: x-omniroute-video-bridge-principal
          required: true
          description: Canonical visible-ASCII, opaque non-secret principal ID; production tenant derivation is required before enabling a caller
          schema:
            type: string
            minLength: 1
            maxLength: 256
            pattern: "^[!-~]{1,256}$"
        - in: query
          name: sessionId
          required: true
          description: Canonical opaque ID without surrounding whitespace
          schema: { type: string, minLength: 1, maxLength: 128 }
        - in: query
          name: videoRef
          required: true
          description: Canonical opaque reference without surrounding whitespace
          schema: { type: string, minLength: 1, maxLength: 4096 }
        - in: query
          name: start
          required: false
          schema: { type: number, minimum: 0 }
        - in: query
          name: end
          required: false
          schema: { type: number, minimum: 0 }
        - in: query
          name: frames
          required: false
          schema: { type: integer, minimum: 1, maximum: 16 }
      responses:
        "200": { description: Bounded cached frame slice with derivation audit metadata }
        "403": { description: Trusted loopback/token identity and principal required }
        "404": { description: Drill-down session or media key was not found }
    post:
      x-loopback-only: true
      tags: [System]
      summary: Store a bounded Video Bridge drill-down result
      description: Internal lifecycle operation for explicitly authorized callers. The short-lived cache is isolated by principal, session, and media reference; enforces independent per-principal and global retained-byte quotas; accepts canonical Base64 only after a warning-sensitive bounded full JPEG decode/re-encode; strips trailing polyglot bytes; retains and charges only the canonical JPEG output; derives resolution from decoded bytes; and does not alter the primary request cost. The JSON wire budget includes Base64 overhead for the 32 MiB decoded-input ceiling.
      security: []
      parameters:
        - in: header
          name: x-omniroute-video-bridge-principal
          required: true
          description: Canonical visible-ASCII, opaque non-secret principal ID; production tenant derivation is required before enabling a caller
          schema:
            type: string
            minLength: 1
            maxLength: 256
            pattern: "^[!-~]{1,256}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sessionId, videoRef, derivation, durationSeconds, frames]
              properties:
                sessionId:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: Canonical opaque ID without surrounding whitespace
                videoRef:
                  type: string
                  minLength: 1
                  maxLength: 4096
                  description: Canonical opaque reference without surrounding whitespace
                derivation:
                  type: object
                  additionalProperties: false
                  required: [parentContentHash, policy, version]
                  properties:
                    parentContentHash:
                      type: string
                      pattern: "^sha256:[a-f0-9]{64}$"
                    policy:
                      type: string
                      pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]{0,63}$"
                    version:
                      type: string
                      pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]{0,63}$"
                durationSeconds: { type: number, exclusiveMinimum: 0, maximum: 600 }
                frames:
                  type: array
                  minItems: 1
                  maxItems: 16
                  items:
                    type: object
                    additionalProperties: false
                    required: [timestampSeconds, dataUri]
                    properties:
                      timestampSeconds: { type: number, minimum: 0 }
                      dataUri:
                        type: string
                        minLength: 27
                        maxLength: 5592431
                        description: Canonical Base64 data URI whose decoded bytes pass a warning-sensitive bounded full JPEG decode/re-encode; trailing bytes are discarded and width and height are derived server-side
      responses:
        "201": { description: Drill-down result stored }
        "403": { description: Trusted loopback/token identity and principal required }
        "413": { description: Payload exceeds the bounded session budget }
        "499": { description: Caller cancelled before the derivation was committed }
    delete:
      x-loopback-only: true
      tags: [System]
      summary: Delete a Video Bridge drill-down session
      security: []
      parameters:
        - in: header
          name: x-omniroute-video-bridge-principal
          required: true
          description: Canonical visible-ASCII, opaque non-secret principal ID; production tenant derivation is required before enabling a caller
          schema:
            type: string
            minLength: 1
            maxLength: 256
            pattern: "^[!-~]{1,256}$"
        - in: query
          name: sessionId
          required: true
          description: Canonical opaque ID without surrounding whitespace
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200": { description: Session entries removed }
        "403": { description: Trusted loopback/token identity and principal required }


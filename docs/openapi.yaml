  # ─── Proxy Endpoints ──────────────────────────────────────────

  /api/v1/search:
    get:
      tags: [Search]
      summary: List search providers
      description: Lists configured search providers and their supported search types.
      responses:
        "200":
          description: Search provider catalog
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object:
                    type: string
                    const: list
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, object, created, name, search_types]
                      properties:
                        id:
                          type: string
                        object:
                          type: string
                          const: search_provider
                        created:
                          type: integer
                        name:
                          type: string
                        search_types:
                          type: array
                          items:
                            type: string
                            enum: [web, news, x]
    post:
      tags: [Search]
      summary: Run a unified search
      description: >-
        Searches the web, news, or X through a configured provider. Set `provider`
        to `xquik-search` to use Xquik for X search. The aliases `xquik` and
        `xquik_search` resolve to the same provider.
        AnySearch (`anysearch-search`, aliases `anysearch` / `anysearch_search`)
        provides free fallback-only web search.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  minLength: 1
                  maxLength: 500
                provider:
                  type: string
                  minLength: 1
                  description: A search provider id or registered alias.
                  examples: [xquik-search]
                max_results:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 5
                search_type:
                  type: string
                  enum: [web, news, x]
                  default: web
                offset:
                  type: integer
                  minimum: 0
                  default: 0
                country:
                  type: string
                  maxLength: 2
                language:
                  type: string
                  minLength: 2
                  maxLength: 5
                time_range:
                  type: string
                  enum: [any, hour, day, week, month, year]
                content:
                  type: object
                  properties:
                    snippet: { type: boolean, default: true }
                    full_page: { type: boolean, default: false }
                    format: { type: string, enum: [text, markdown], default: text }
                    max_characters: { type: integer, minimum: 100, maximum: 100000 }
                filters:
                  type: object
                  properties:
                    include_domains:
                      type: array
                      maxItems: 20
                      items: { type: string, maxLength: 253 }
                    exclude_domains:
                      type: array
                      maxItems: 20
                      items: { type: string, maxLength: 253 }
                    safe_search: { type: string, enum: [off, moderate, strict] }
                provider_options:
                  type: object
                  additionalProperties: true
                strict_filters:
                  type: boolean
                  default: false
              additionalProperties: true
      responses:
        "200":
          description: Normalized search results
          content:
            application/json:
              schema:
                type: object
                required: [id, provider, query, results, answer, usage, metrics, errors, cached]
                properties:
                  id:
                    type: string
                    pattern: ^search-
                  provider:
                    type: string
                  query:
                    type: string
                  cached:
                    type: boolean
                  results:
                    type: array
                    items:
                      type: object
                      required: [title, url, snippet, position, citation]
                      properties:
                        title: { type: string }
                        url: { type: string, format: uri }
                        display_url: { type: string }
                        snippet: { type: string }
                        position: { type: integer, minimum: 1 }
                        score:
                          type: [number, "null"]
                          minimum: 0
                          maximum: 1
                        published_at: { type: [string, "null"] }
                        favicon_url: { type: [string, "null"], format: uri }
                        citation:
                          type: object
                          required: [provider, retrieved_at, rank]
                          properties:
                            provider: { type: string }
                            retrieved_at: { type: string, format: date-time }
                            rank: { type: integer, minimum: 1 }
                  answer:
                    type: [object, "null"]
                  usage:
                    type: object
                    required: [queries_used, search_cost_usd]
                    properties:
                      queries_used: { type: integer, minimum: 0 }
                      search_cost_usd: { type: number, minimum: 0 }
                      llm_tokens: { type: integer, minimum: 0 }
                  metrics:
                    type: object
                    required: [response_time_ms, upstream_latency_ms, total_results_available]
                    properties:
                      response_time_ms: { type: number, minimum: 0 }
                      upstream_latency_ms: { type: number, minimum: 0 }
                      gateway_latency_ms: { type: number, minimum: 0 }
                      total_results_available: { type: [integer, "null"], minimum: 0 }
                  errors:
                    type: array
                    items:
                      type: object
                      required: [provider, code, message]
                      properties:
                        provider: { type: string }
                        code: { type: string }
                        message: { type: string }
        "400":
          description: Invalid request, provider, credentials, or search type
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Search provider blocked by API key or security policy
        "429":
          description: Every eligible provider credential is rate limited
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          description: Search provider failed

  /api/v1/chat/completions:
    post:
      tags: [Chat]
      summary: Create chat completion
      description: OpenAI-compatible chat completions endpoint. Routes to configured providers.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: Chat completion response (or SSE stream)
          headers:
            X-OmniRoute-Response-Cost:
              schema:
                type: string
              description: Request cost in USD, fixed 10 decimals (e.g. `0.0001234500`; `0.0000000000` for free/unpriced).
            X-OmniRoute-Tokens-In:
              schema:
                type: string
              description: Input (prompt) token count.
            X-OmniRoute-Tokens-Out:
              schema:
                type: string
              description: Output (completion) token count.
            X-OmniRoute-Model:
              schema:
                type: string
              description: Resolved model.
            X-OmniRoute-Provider:
              schema:
                type: string
              description: Resolved provider alias.
            X-OmniRoute-Latency-Ms:
              schema:
                type: string
              description: Handler latency in milliseconds.
            X-OmniRoute-Cache-Hit:
              schema:
                type: string
                enum: ["true", "false"]
              description: Whether the response was served from cache.
            X-OmniRoute-Fallback-Attempts:
              schema:
                type: string
              description: Number of fallback attempts (only present when > 0).
            X-OmniRoute-Decision:
              schema:
                type: string
              description: >-
                Routing decision trace: `strategy=<name>; provider=<alias>; latency_ms=<n>`.
                `<name>` is the combo strategy (e.g. `priority`, `weighted`, `fusion`) or
                `single` for a non-combo request. Emitted on every completion response.
            X-OmniRoute-Request-Id:
              schema:
                type: string
              description: Request correlation id (present when known).
            X-OmniRoute-Version:
              schema:
                type: string
              description: OmniRoute build version (always present).
            X-OmniRoute-Cost-Saved:
              schema:
                type: string
              description: >-
                On a semantic-cache HIT, the original (would-have-been) cost in USD that
                the cache avoided (fixed 10 decimals). Present only on cache hits;
                X-OmniRoute-Response-Cost is 0 for the same response (incremental cost).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionResponse"
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: All upstream providers failed

  /api/v1/ws:
    get:
      tags: [Chat]
      summary: Chat completion over WebSocket (handshake + upgrade)
      description: >-
        OpenAI-compatible chat over a WebSocket connection. `GET` with
        `?handshake=1` returns the connection descriptor (auth path, message
        protocol and live-event channels) as JSON; a plain `GET` without an
        Upgrade returns `426 Upgrade Required`. After upgrading, the client
        exchanges JSON frames — `{type:"request", id, payload:{model, messages}}`
        to start a completion and `{type:"cancel", id}` to abort it. A separate
        live channel (default port `LIVE_WS_PORT=20129`, path `/live`) streams
        dashboard events on the `requests`, `combo` and `credentials` topics with
        a 15s heartbeat. Requires an API key.
      security:
        - BearerAuth: []
      parameters:
        - name: handshake
          in: query
          description: Set to `1` to receive the JSON connection descriptor instead of upgrading.
          required: false
          schema:
            type: string
            enum: ["1"]
      responses:
        "101":
          description: WebSocket upgrade successful
        "200":
          description: Handshake descriptor (auth path, message protocol, live channels)
        "401":
          description: WebSocket auth required (no credential supplied)
        "403":
          description: Invalid WebSocket credential
        "426":
          description: Upgrade Required — connect via WebSocket or use `?handshake=1`


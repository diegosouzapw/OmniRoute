      summary: Save database backup retention settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                keepLatest:
                  type: integer
                  minimum: 1
                  maximum: 200
                retentionDays:
                  type: integer
                  minimum: 0
                  maximum: 3650
      responses:
        "200":
          description: Backup retention settings saved

  /api/storage/health:
    get:
      tags: [System]
      summary: Check storage health
      responses:
        "200":
          description: Storage health status

  /api/sync/cloud:
    post:
      tags: [System]
      summary: Sync with cloud
      responses:
        "200":
          description: Sync result

  /api/sync/initialize:
    post:
      tags: [System]
      summary: Initialize cloud sync
      responses:
        "200":
          description: Sync initialized

  # ─── Background Jobs (local-only administration) ───────────────

  /api/jobs:
    get:
      tags: [System]
      summary: List registered background jobs
      description: Local-only runtime administration. Returns each registered job and its latest run.
      x-internal: true
      responses:
        "200":
          description: Registered jobs
        "500":
          description: Failed to list jobs

  /api/jobs/{id}/enable:
    post:
      tags: [System]
      summary: Enable a background job
      description: Local-only runtime administration. Enables the job and restarts its timer.
      x-internal: true
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job enabled
        "404":
          description: Job not found
        "500":
          description: Failed to enable job

  /api/jobs/{id}/disable:
    post:
      tags: [System]
      summary: Disable a background job
      description: Local-only runtime administration. Disables the job and stops its timer.
      x-internal: true
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job disabled
        "404":
          description: Job not found
        "500":
          description: Failed to disable job

  /api/jobs/{id}/run-now:
    post:
      tags: [System]
      summary: Trigger a background job
      description: >-
        Local-only runtime administration. Starts the job, or waits for an in-flight
        run before queueing the next one, subject to OMNIROUTE_RUNNOW_TIMEOUT_MS.
      x-internal: true
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job trigger accepted
        "404":
          description: Job not found
        "500":
          description: Failed to trigger job

  /api/jobs/{id}/runs:
    get:
      tags: [System]
      summary: Read background-job run history
      description: Local-only runtime administration. Returns newest-first run history for one job.
      x-internal: true
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job run history
        "404":
          description: Job not found
        "500":
          description: Failed to load job runs

  # ─── Log export ─────────────────────────────────────────────────

  /api/log-export/types:
    get:
      tags: [System]
      summary: List log-export destination types
      description: >-
        Returns every registered destination type with the config field descriptors the
        dashboard renders its form from. Adding a destination type needs no UI change.
      responses:
        "200":
          description: Destination types and their config fields
        "500":
          description: Failed to list destination types

  /api/log-export/destinations:
    get:
      tags: [System]
      summary: List log-export destinations
      description: Secrets are redacted; a stored secret is returned as the literal `__stored__`.
      responses:
        "200":
          description: Configured destinations with cursor, backlog, and last-run state
        "500":
          description: Failed to list destinations
    post:
      tags: [System]
      summary: Create a log-export destination
      description: >-
        The config object is validated against the destination type's own schema. Secret
        keys declared by the type are encrypted at rest and never echoed back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, config]
              properties:
                name:
                  type: string
                type:
                  type: string
                enabled:
                  type: boolean
                config:
                  type: object
                  additionalProperties: true
                batchSize:
                  type: integer
                maxRowsPerRun:
                  type: integer
      responses:
        "201":
          description: Destination created
        "400":
          description: Unknown destination type or invalid configuration
        "500":
          description: Failed to create destination

  /api/log-export/destinations/{id}:
    get:
      tags: [System]
      summary: Read one log-export destination
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Destination with secrets redacted
        "404":
          description: Destination not found
        "500":
          description: Failed to read destination
    put:
      tags: [System]
      summary: Update a log-export destination
      description: >-
        Sending `__stored__` for a secret keeps the stored credential. The destination type
        is immutable after creation.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                enabled:
                  type: boolean
                config:
                  type: object
                  additionalProperties: true
                batchSize:
                  type: integer
                maxRowsPerRun:
                  type: integer
      responses:
        "200":
          description: Destination updated
        "400":
          description: Invalid configuration
        "404":
          description: Destination not found
        "500":
          description: Failed to update destination
    delete:
      tags: [System]
      summary: Delete a log-export destination
      description: Removes the destination and its export cursor.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Destination deleted
        "404":
          description: Destination not found
        "500":
          description: Failed to delete destination

  /api/log-export/destinations/{id}/test:
    post:
      tags: [System]
      summary: Test a log-export destination
      description: >-
        Probes credentials and reachability without writing rows. A failed probe is reported
        as 200 with `ok: false` and an operator-facing reason.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Probe result
        "404":
          description: Destination not found

  /api/log-export/destinations/{id}/run:
    post:
      tags: [System]
      summary: Run a log-export destination now
      description: >-
        Drains pending call logs into this destination using the same cursor semantics as the
        hourly job.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Run result with exported count, batches, and remaining backlog
        "404":
          description: Destination not found
        "500":
          description: Failed to run the export

  /api/log-export/status:
    get:
      tags: [System]
      summary: Log-export scheduler status
      description: Cron expression, recent job runs, and the per-destination backlog.
      responses:
        "200":
          description: Scheduler state and destination backlog
        "500":
          description: Failed to read status

  # ─── Resilience & Monitoring ────────────────────────────────────

  /api/resilience:
    get:
      tags: [System]
      summary: Get resilience configuration
      responses:
        "200":
          description: Request queue, connection cooldown, provider breaker, and wait settings
    patch:
      tags: [System]
      summary: Update resilience configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated resilience configuration

  /api/resilience/connections:
    get:
      tags: [System]
      summary: Inspect connection resilience state
      description: >-
        Local-only operational view of per-connection cooldowns, provider circuit
        breakers, model lockouts, and recent breaker transitions. Credential columns
        are excluded by an explicit database whitelist.
      x-internal: true
      parameters:
        - name: windowMs
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 86400000
            default: 3600000
        - name: provider
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "200":
          description: Connection, breaker, lockout, window, and degradation metadata
        "400":
          description: Invalid query parameters
        "500":
          description: Failed to collect resilience state

  /api/telegram/update:
    post:
      tags: [System]
      summary: Receive Telegram updates or Mini App messages
      description: >-
        Public Telegram integration endpoint. Bot updates are acknowledged after
        reply dispatch is queued. Mini App requests must include Telegram-signed
        initData, which is verified with TELEGRAM_BOT_TOKEN before chat proxying.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                initData:
                  type: string
                message:
                  type: string
                update_id:
                  type: integer
      responses:

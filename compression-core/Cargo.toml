[workspace]
resolver = "2"
members = [
    "crates/core-api",
    "crates/tokenizer",
    "crates/tests",
    "crates/bench",
    "crates/ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Egorich-print/OmniRoute"

[workspace.dependencies]
core-api = { path = "crates/core-api" }
tokenizer = { path = "crates/tokenizer" }
tiktoken-rs = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1

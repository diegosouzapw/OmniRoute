{{- if .Values.secrets.create -}}
{{- if .Values.secrets.existingSecret -}}
{{- fail "omniroute: set either secrets.create=true or secrets.existingSecret, not both." -}}
{{- end -}}
{{- if not (and .Values.secrets.jwtSecret .Values.secrets.apiKeySecret) -}}
{{- fail "omniroute: secrets.create=true requires at least secrets.jwtSecret and secrets.apiKeySecret. Generate with `openssl rand -base64 48` and `openssl rand -hex 32`." -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "omniroute.fullname" . }}
  labels:
    {{- include "omniroute.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  API_KEY_SECRET: {{ .Values.secrets.apiKeySecret | quote }}
  {{- with .Values.secrets.storageEncryptionKey }}
  STORAGE_ENCRYPTION_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.initialPassword }}
  INITIAL_PASSWORD: {{ . | quote }}
  {{- end }}
{{- end }}

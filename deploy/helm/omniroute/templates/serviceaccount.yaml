{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "omniroute.serviceAccountName" . }}
  labels:
    {{- include "omniroute.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# OmniRoute never calls the Kubernetes API; no token needs to be projected.
automountServiceAccountToken: false
{{- end }}

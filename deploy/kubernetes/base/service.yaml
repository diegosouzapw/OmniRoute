apiVersion: v1
kind: Service
metadata:
  name: omniroute
  labels:
    app.kubernetes.io/name: omniroute
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: omniroute
  ports:
    - name: http
      port: 20128
      targetPort: http
      protocol: TCP
    - name: live-ws
      port: 20132
      targetPort: live-ws
      protocol: TCP

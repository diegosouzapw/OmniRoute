# TEMPLATE ONLY — do NOT apply as-is and do NOT commit a filled-in copy.
#
# Generate real values:
#   JWT_SECRET=$(openssl rand -base64 48)
#   API_KEY_SECRET=$(openssl rand -hex 32)
#   STORAGE_ENCRYPTION_KEY=$(openssl rand -hex 32)
#   INITIAL_PASSWORD=$(openssl rand -base64 24)
#
# Then create the Secret imperatively so the values never touch git:
#
#   kubectl -n omniroute create secret generic omniroute-secrets \
#     --from-literal=JWT_SECRET="$JWT_SECRET" \
#     --from-literal=API_KEY_SECRET="$API_KEY_SECRET" \
#     --from-literal=STORAGE_ENCRYPTION_KEY="$STORAGE_ENCRYPTION_KEY" \
#     --from-literal=INITIAL_PASSWORD="$INITIAL_PASSWORD"
#
# STORAGE_ENCRYPTION_KEY encrypts provider credentials at rest. Losing it makes
# every stored provider connection unreadable; rotate it only via the documented
# re-encryption path, never by editing this value in place.
apiVersion: v1
kind: Secret
metadata:
  name: omniroute-secrets
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME"
  API_KEY_SECRET: "REPLACE_ME"
  STORAGE_ENCRYPTION_KEY: "REPLACE_ME"
  INITIAL_PASSWORD: "REPLACE_ME"

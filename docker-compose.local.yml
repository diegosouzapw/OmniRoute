# ──────────────────────────────────────────────────────────────────────────────
#  OmniRoute — Personal Local Deployment (source-built + Qdrant)
# ──────────────────────────────────────────────────────────────────────────────
#
#  Builds OmniRoute from the local fork source instead of pulling a pre-built
#  image. Qdrant is always active as a persistent sidecar for the Memory Engine.
#
#  QUICK START:
#    cp .env.example .env          # then fill in your secrets
#    docker compose -f docker-compose.local.yml build
#    docker compose -f docker-compose.local.yml up -d
#
#  STOP / RESTART:
#    docker compose -f docker-compose.local.yml down      # keeps volumes
#    docker compose -f docker-compose.local.yml up -d     # restart
#
#  REBUILD after source changes:
#    docker compose -f docker-compose.local.yml build --no-cache omniroute
#    docker compose -f docker-compose.local.yml up -d
#
#  LOGS:
#    docker compose -f docker-compose.local.yml logs -f
#    docker compose -f docker-compose.local.yml logs -f omniroute
#    docker compose -f docker-compose.local.yml logs -f qdrant
#
#  DATA VOLUMES:
#    omniroute-local-data   — OmniRoute SQLite DB, secrets, call logs
#    omniroute-qdrant-data  — Qdrant vector storage (persistent)
#    omniroute-redis-local-data — Redis AOF / RDB
#
#  NETWORK:
#    omniroute-local-net (internal bridge)
#    Only OmniRoute publishes a port to the host: 127.0.0.1:20128.
#    Qdrant (6333/6334) and Redis (6379) are internal-only.
#
#  ROLLBACK PROCEDURE (if migration fails):
#    docker compose -f docker-compose.local.yml down
#    docker start omniroute          # restart original pre-migration container
#    curl http://127.0.0.1:20128/health
#
#  IMPORTANT: Never commit .env to git. See .gitignore.
# ──────────────────────────────────────────────────────────────────────────────

networks:
  omniroute-local-net:
    name: omniroute-local-net
    driver: bridge
    # Internal bridge: no external routing by default. All services communicate
    # by service name (e.g. redis, qdrant) over this network.

# ── Shared base configuration ──────────────────────────────────────────────
x-omniroute-common: &omniroute-common
  restart: unless-stopped
  stop_grace_period: 40s
  networks:
    - omniroute-local-net

services:
  # ── Redis (Rate Limiter & session backend) ─────────────────────────────
  redis:
    <<: *omniroute-common
    image: docker.io/library/redis:8.6.5-alpine
    container_name: omniroute-local-redis
    # No host port: Redis is internal-only. The app reaches it at redis:6379.
    volumes:
      - omniroute-redis-local-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ── Qdrant (Vector Memory sidecar) ────────────────────────────────────
  # Pinned to v1.12.4 (same as upstream docker-compose.yml profile).
  # No host port: Qdrant is internal-only — OmniRoute reaches it at qdrant:6333.
  # To expose temporarily for tooling: add `ports: ["127.0.0.1:6333:6333"]`
  # then remove it again. Never expose to 0.0.0.0 without auth.
  qdrant:
    <<: *omniroute-common
    image: docker.io/qdrant/qdrant:v1.12.4
    container_name: omniroute-local-qdrant
    # No host ports: internal network only.
    volumes:
      - omniroute-qdrant-data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      # Qdrant v1.12.4 image does not ship wget or curl.
      # Use bash /dev/tcp to verify the REST port is open and responding.
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e 'GET /readyz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '200' <&3",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── OmniRoute (built from source) ─────────────────────────────────────
  omniroute:
    <<: *omniroute-common
    container_name: omniroute-local
    build:
      context: .
      # runner-web includes Chromium/Playwright for gemini-web / claude-web / claude-turnstile.
      # Switch to runner-base if browser-based providers are not needed.
      # Switch to runner-cli if you need embedded CLI providers (Claude Code, etc.)
      target: runner-web
      args:
        OMNIROUTE_BASE_PATH: ${OMNIROUTE_BASE_PATH:-}
        OMNIROUTE_BUILD_MEMORY_MB: ${OMNIROUTE_BUILD_MEMORY_MB:-8192}
        # Turbopack (Rust binary) fails to fork on OrbStack due to a known
        # Rust/linux-aarch64 compat issue. Use webpack instead.
        # Remove this arg if you switch to Docker Desktop or a native Linux host.
        OMNIROUTE_USE_TURBOPACK: "0"
    image: omniroute:local
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    env_file: .env
    environment:
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - PORT=${PORT:-20128}
      - DASHBOARD_PORT=${DASHBOARD_PORT:-20128}
      - API_PORT=${API_PORT:-20129}
      - API_HOST=${API_HOST:-0.0.0.0}
      - LIVE_WS_PORT=${LIVE_WS_PORT:-20132}
      - LIVE_WS_HOST=${LIVE_WS_HOST:-0.0.0.0}
      - LIVE_WS_ALLOWED_ORIGINS=${LIVE_WS_ALLOWED_ORIGINS:-http://localhost:20128,http://127.0.0.1:20128}
      - HOSTNAME=0.0.0.0
      - REDIS_URL=redis://redis:6379
      - NODE_OPTIONS=--max-old-space-size=1024
      - OMNIROUTE_BASE_PATH=${OMNIROUTE_BASE_PATH:-}
      # ── Qdrant / Memory ──────────────────────────────────────────────
      # Service name resolves inside the compose network to the qdrant container.
      # Settings-table values take precedence over these env vars (see
      # src/lib/memory/qdrant.ts:normalizeQdrantConfig). If you configure Qdrant
      # via the dashboard Settings → Memory, these become the fallback defaults.
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-omniroute_memory}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
    ports:
      # Loopback-only: mirroring original container config.
      - "127.0.0.1:${DASHBOARD_PORT:-20128}:${DASHBOARD_PORT:-20128}"
      - "127.0.0.1:${API_PORT:-20129}:${API_PORT:-20129}"
      - "127.0.0.1:${LIVE_WS_PORT:-20132}:${LIVE_WS_PORT:-20132}"
    volumes:
      - omniroute-local-data:/app/data
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  omniroute-local-data:
    name: omniroute-local-data
    external: true # Created and populated manually from backup during migration
  omniroute-qdrant-data:
    name: omniroute-qdrant-data
  omniroute-redis-local-data:
    name: omniroute-redis-local-data

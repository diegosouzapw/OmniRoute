name: Dependency Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: true
          # @keyv/sqlite@4 pulls sqlite3@6, whose node-gyp toolchain includes
          # isexe@4 under BlueOak-1.0.0. Permit this transitive license while
          # retaining the deny-by-default policy for all other unlisted licenses.
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, Unlicense, 0BSD, CC0-1.0, BlueOak-1.0.0, MPL-2.0, Zlib, Unicode-3.0, Apache-2.0 WITH LLVM-exception
          # Sonar's pinned GitHub Action is LGPL-3.0. Exempt only this immutable
          # action dependency; LGPL remains denied for every package and action.
          # sharp@^0.35 ships prebuilt libvips binaries under LGPL-3.0-or-later.
          # The LGPL packages are @img/sharp-libvips-* and @img/sharp-wasm32
          # (bundled dependencies), not the sharp wrapper itself. Exempt the
          # @img/sharp-* scope so all platform binary packages are covered.
          # A future sharp upgrade re-triggers this gate for deliberate review.
          allow-dependencies-licenses: >-
            pkg:githubactions/SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f,
            pkg:cargo/brotli-decompressor@5.0.3,
            pkg:cargo/dbus@0.9.12,
            pkg:cargo/libdbus-sys@0.2.7,
            pkg:npm/@img/sharp-darwin-arm64@0.35.4,
            pkg:npm/@img/sharp-darwin-x64@0.35.4,
            pkg:npm/@img/sharp-linux-arm64@0.35.4,
            pkg:npm/@img/sharp-linux-s390x@0.35.4,
            pkg:npm/@img/sharp-linux-x64@0.35.4,
            pkg:npm/@img/sharp-libvips-darwin-arm64@0.4.0,
            pkg:npm/@img/sharp-libvips-darwin-x64@0.4.0,
            pkg:npm/@img/sharp-libvips-linux-arm64@0.4.0,
            pkg:npm/@img/sharp-libvips-linux-s390x@0.4.0,
            pkg:npm/@img/sharp-libvips-linux-x64@0.4.0,
            pkg:npm/@img/sharp-wasm32@0.35.4,
            pkg:npm/sharp@0.35.4

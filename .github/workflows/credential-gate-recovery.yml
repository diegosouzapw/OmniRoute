name: Credential gate recovery

on:
  pull_request:
    branches: [main, "release/**"]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/lib/credentialHealth/**"
      - "src/app/api/providers/*/test/**"
      - "open-sse/services/credentialGate.ts"
      - "tests/unit/credential-gate-recovery.test.ts"
      - "tests/unit/connection-test-health.test.ts"
      - "tests/unit/provider-connection-test-key-health.test.ts"
      - "tests/unit/provider-validation-unsupported-neutral.test.ts"
      - "tests/unit/combo/protected-priority-stop-status-13439.test.ts"
      - ".github/workflows/credential-gate-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-recovery:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - uses: ./.github/actions/npm-ci-retry
      - name: Verify credential verdicts and persisted manual recovery
        timeout-minutes: 5
        shell: bash
        run: >-
          node --import tsx/esm
          --import ./open-sse/utils/setupPolyfill.ts
          --import ./tests/_setup/isolateDataDir.ts
          --test --test-concurrency=1 --test-timeout=60000
          tests/unit/credential-gate-recovery.test.ts
          tests/unit/connection-test-health.test.ts
          tests/unit/provider-connection-test-key-health.test.ts
          tests/unit/provider-validation-unsupported-neutral.test.ts
          tests/unit/combo/protected-priority-stop-status-13439.test.ts
        env:
          NODE_ENV: test
          DISABLE_SQLITE_AUTO_BACKUP: "true"
          OMNIROUTE_DISABLE_CREDENTIAL_HEALTH_CHECK: "true"
          OMNIROUTE_SKIP_SYSTEM_TRUST: "1"
          APP_LOG_TO_FILE: "false"
          DATA_DIR: ${{ runner.temp }}/credential-recovery-data
          HOME: ${{ runner.temp }}/credential-recovery-home
          USERPROFILE: ${{ runner.temp }}/credential-recovery-home
          APPDATA: ${{ runner.temp }}/credential-recovery-home
          LOCALAPPDATA: ${{ runner.temp }}/credential-recovery-home
          HOOKMAKER_MAX_TEST_WORKERS: "1"

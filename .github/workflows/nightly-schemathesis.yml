name: Nightly Schemathesis
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schemathesis:
    if: ${{ github.event_name != 'schedule' || github.repository == 'diegosouzapw/OmniRoute' }}
    name: Schemathesis — OpenAPI contract fuzz (advisory)
    # #11965: this job runs a backend-only `next build`; the hosted 7 GB runner cannot build
    # release/v3.8.51 (VM shutdown ~7 min in), so it targets the box's light pool (`omni-light`:
    # two listeners, jobs ≤ ~6 GB). Falls back to hosted when USE_VPS_RUNNER is off.
    runs-on: ${{ (vars.USE_VPS_RUNNER == 'true' && fromJSON('["self-hosted","omni-light"]')) || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm }
      - name: Prepare isolated runtime state
        id: runtime
        run: |
          data_dir=$(mktemp -d "$RUNNER_TEMP/omniroute-schemathesis.XXXXXX")
          mkdir "$data_dir/plugins"
          {
            echo "DATA_DIR=$data_dir"
            echo "OMNIROUTE_PLUGINS_DIR=$data_dir/plugins"
          } >> "$GITHUB_ENV"
      - run: npm ci
      - name: Build CLI bundle
        env:
          JWT_SECRET: ci-build-secret-with-sufficient-length-for-validation
          OMNIROUTE_BUILD_BACKEND_ONLY: "1"
        run: npm run build:cli
      - name: Start OmniRoute (background)
        env:
          JWT_SECRET: ci-build-secret-with-sufficient-length-for-validation
          HOSTNAME: "127.0.0.1"
          PORT: "21780"
        run: |
          # A persistent runner can already host another deployment. Never fuzz it.
          if (echo > /dev/tcp/127.0.0.1/"$PORT") 2>/dev/null; then
            echo "::error::Port $PORT is already occupied; refusing to probe another server."
            exit 1
          fi
          node dist/server.js > server.log 2>&1 &
          server_pid=$!
          echo "$server_pid" > "$DATA_DIR/server.pid"
          for _ in $(seq 1 30); do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "::error::OmniRoute exited before becoming ready; see server.log."
              exit 1
            fi
            if curl --max-time 2 -sf "http://127.0.0.1:$PORT/api/monitoring/health" >/dev/null && kill -0 "$server_pid" 2>/dev/null; then
              echo "server up"
              exit 0
            fi
            sleep 2
          done
          echo "::error::OmniRoute did not become healthy after 30 attempts; see server.log."
          exit 1
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Install schemathesis
        run: pip install schemathesis
      - name: Schemathesis contract fuzz (advisory)
        # Advisory gate: never fails the job. `continue-on-error` covers a crash of the
        # step itself; `|| true` covers schemathesis exiting non-zero when it finds spec
        # violations / upstream 500s — both are expected here (most /v1 endpoints proxy an
        # upstream that has no provider configured in CI). The point of the nightly is to
        # PROVE the contract is fuzzable and surface regressions, not to gate the build.
        continue-on-error: true
        run: |
          schemathesis run docs/openapi.yaml \
            --url http://127.0.0.1:21780 \
            --max-examples 20 \
            --workers 4 \
            --checks all \
            --max-response-time 30 \
            --request-timeout 30 \
            --suppress-health-check all \
            --report junit \
            --report-junit-path schemathesis-report/junit.xml \
            --no-color \
            || true
      - name: Stop server
        if: always() && steps.runtime.outcome == 'success'
        run: |
          if [ -n "$DATA_DIR" ] && [ -f "$DATA_DIR/server.pid" ]; then
            kill "$(cat "$DATA_DIR/server.pid")" || true
          fi
      - name: Upload schemathesis report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: schemathesis-report
          path: |
            schemathesis-report/
            server.log
          if-no-files-found: warn
          retention-days: 14

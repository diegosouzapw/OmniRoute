          printf 'SHADOW_CONTROL=%s\nSHADOW_STATE_DIR=%s\n' "$SHADOW_CONTROL" "$SHADOW_STATE_DIR" >> "$GITHUB_ENV"
          [[ "$SHADOW_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]

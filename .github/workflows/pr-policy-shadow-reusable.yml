          files=(
            package.json
            config/quality/gate-manifest.json
            config/quality/admission-policy.json
            scripts/quality/classify-pr-changes.mjs
            scripts/quality/gate-manifest.mjs
            scripts/quality/select-impacted-tests.mjs
            scripts/quality/shadow-gate-policy.mjs
            scripts/quality/shadow-policy-bootstrap.mjs
            scripts/quality/shadow-policy-receipt.mjs
            scripts/check/check-pr-self-target.mjs
            .github/workflows/pr-policy-shadow.yml
            .github/workflows/pr-policy-shadow-reusable.yml
          )
          for file in "${files[@]}"; do
            mkdir -p "$SHADOW_CONTROL/$(dirname "$file")"
            git show "$SHADOW_WORKFLOW_SHA:$file" > "$SHADOW_CONTROL/$file"
          done
      - uses: actions/download-artifact@v8
        with:
          name: shadow-plan-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ env.SHADOW_STATE_DIR }}
      - name: Verify immutable plan and checkout
        id: verify
        run: node "$SHADOW_CONTROL/scripts/quality/shadow-policy-bootstrap.mjs" verify
      - uses: ./.github/actions/npm-ci-retry
        with:
          cache: ${{ github.event_name == 'pull_request' }}
      - run: node scripts/i18n/check-ui-keys-coverage.mjs --threshold=65
        id: gate_0
      - name: i18n ICU compilation (all UI catalogs)
        run: npm run check:ui-icu
        id: gate_1
      - name: i18n real-translation ratio
        run: node scripts/i18n/check-translation-ratio.mjs
        id: gate_2
      - name: i18n UI value drift (stale translations)
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/i18n/check-ui-value-drift.mjs
        id: gate_3
      - name: i18n new-key coverage (a new key must reach every locale)
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/i18n/check-new-key-coverage.mjs
        id: gate_4
      - name: i18n key completeness (every locale carries every en.json key)
        run: node scripts/i18n/check-key-completeness.mjs
        id: gate_5
      - name: i18n key completeness (CLI catalogs)
        run: node scripts/i18n/check-key-completeness.mjs --catalog=cli
        id: gate_6
      - name: Record original step outcomes
        if: always()
        env:
          SHADOW_STEPS: ${{ toJSON(steps) }}
          SHADOW_JOB_STATUS: ${{ job.status }}
        run: node "$SHADOW_CONTROL/scripts/quality/shadow-policy-receipt.mjs" write
      - name: Preserve receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shadow-receipt-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-ci_i18n_ui_coverage
          path: ${{ env.SHADOW_STATE_DIR }}/receipt.json
          if-no-files-found: error

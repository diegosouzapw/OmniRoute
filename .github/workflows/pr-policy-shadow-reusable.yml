          cache: ${{ github.event_name == 'pull_request' }}
      - run: node scripts/i18n/check-glossary-consistency.mjs --locale=zh-CN
        id: gate_0
      - run: node scripts/i18n/check-glossary-consistency.mjs --locale=zh-TW
        id: gate_1

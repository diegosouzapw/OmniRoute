          name: shadow-plan-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ env.SHADOW_STATE_DIR }}
      - name: Verify immutable plan and checkout
        id: verify
        run: node "$SHADOW_CONTROL/scripts/quality/shadow-policy-bootstrap.mjs" verify
      - name: Fetch base branch
        run: git cat-file -e "${GITHUB_BASE_SHA}^{commit}"
        id: gate_0
      - name: Validate source changes include tests
        run: node scripts/check/check-pr-test-policy.mjs --summary-file .artifacts/pr-test-policy.md
        id: gate_1
      - name: Detect test-masking (weakened assertions)
        run: npm run check:test-masking
        id: gate_2
      - name: Require evidence in PR body
        run: npm run check:pr-evidence
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        id: gate_3
      - name: Publish PR test policy summary
        if: always()
        run: |
          if [ -f .artifacts/pr-test-policy.md ]; then
            cat .artifacts/pr-test-policy.md >> "$GITHUB_STEP_SUMMARY"
          fi
        id: gate_4
      - name: Preserve original details
        id: details
        if: ${{ always() && steps.verify.outcome == 'success' }}
        run: node "$SHADOW_CONTROL/scripts/quality/shadow-policy-receipt.mjs" preserve
      - name: Preserve details artifact
        if: ${{ always() && steps.details.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: shadow-details-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-ci_pr_test_policy
          path: ${{ env.SHADOW_STATE_DIR }}/details
          if-no-files-found: error
      - name: Record original step outcomes
        if: always()
        env:
          SHADOW_STEPS: ${{ toJSON(steps) }}
          SHADOW_JOB_STATUS: ${{ job.status }}
        run: node "$SHADOW_CONTROL/scripts/quality/shadow-policy-receipt.mjs" write
      - name: Preserve receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shadow-receipt-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-ci_pr_test_policy
          path: ${{ env.SHADOW_STATE_DIR }}/receipt.json
          if-no-files-found: error

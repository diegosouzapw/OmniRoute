  ci_i18n:
    name: Shadow / ci:i18n
    runs-on: ubuntu-latest
    needs: bootstrap
    if: ${{ needs.bootstrap.outputs.ci_i18n == 'true' }}
    continue-on-error: true
    env:
      SHADOW_GROUP: ci:i18n
      SHADOW_PLAN_HASH: ${{ needs.bootstrap.outputs.plan_hash }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:

      - uses: actions/download-artifact@v8
        with:
          name: shadow-plan-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ env.SHADOW_STATE_DIR }}
      - name: Verify immutable plan and checkout
        id: verify
        run: node "$SHADOW_CONTROL/scripts/quality/shadow-policy-bootstrap.mjs" verify
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate all languages
        run: |
          set -uo pipefail
          mkdir -p i18n-results
          FAIL=0
          for f in src/i18n/messages/*.json; do
            lang=$(basename "$f" .json)
            [ "$lang" = "en" ] && continue
            echo "::group::i18n $lang"
            if python3 scripts/i18n/validate_translation.py quick -l "$lang" > "i18n-results/$lang.txt" 2>&1; then
              echo "OK $lang"
            else
              FAIL=1
              echo "FAIL $lang"
              cat "i18n-results/$lang.txt"
            fi
            echo "::endgroup::"
          done
          exit "$FAIL"
        id: gate_0
      - name: Preserve original details
        id: details
        if: ${{ always() && steps.verify.outcome == 'success' }}
        run: node "$SHADOW_CONTROL/scripts/quality/shadow-policy-receipt.mjs" preserve
      - name: Preserve details artifact
        if: ${{ always() && steps.details.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: shadow-details-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-ci_i18n
          path: ${{ env.SHADOW_STATE_DIR }}/details
          if-no-files-found: error
      - name: Record original step outcomes
